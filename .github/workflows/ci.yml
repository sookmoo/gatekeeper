name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # Same digest as deploy/quadlet/gatekeeper-db.container: bump both together.
        image: postgres:17-alpine@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK feature band pinned by global.json.
          dotnet-version: 10.0.1xx
      # Skips cleanly until a solution exists.
      - name: Build and test
        env:
          # Admin connection for the Postgres contract/API tests (each test creates its own database).
          GATEKEEPER_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=ci-only;Database=postgres
        run: |
          if compgen -G "*.sln" >/dev/null || compgen -G "*.slnx" >/dev/null; then
            dotnet restore --locked-mode
            dotnet build --no-restore -warnaserror
            dotnet test --no-build
          else
            echo "No solution yet, skipping."
          fi
      # Reuses the restore and build above (no second restore, no implicit build).
      - name: Check migrations are up to date with the model
        env:
          GATEKEEPER_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=ci-only;Database=postgres
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Gatekeeper.Infrastructure.Postgres --no-build

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Dependabot cannot read these two, so a script keeps them equal.
      - name: Postgres digest is the same in CI and in the Quadlet unit
        run: scripts/check-pg-digest.sh
      - name: Accepted image findings have a reason and a future expiry date
        run: scripts/check-trivy-ignore.sh

  image:
    needs: [build-test, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/sookmoo/gatekeeper
      WEB_IMAGE: ghcr.io/sookmoo/gatekeeper-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f Containerfile -t "$IMAGE:${GITHUB_SHA}" .
      - name: Smoke test (refuses to start without the non-loopback opt-in)
        run: |
          out=$(docker run --rm "$IMAGE:${GITHUB_SHA}" 2>&1 || true)
          echo "$out" | grep -q "Refusing to listen on non-loopback"
      - name: Build web image
        run: docker build -f Containerfile.web -t "$WEB_IMAGE:${GITHUB_SHA}" .
      - name: Smoke test web (refuses to start without the non-loopback opt-in)
        run: |
          out=$(docker run --rm "$WEB_IMAGE:${GITHUB_SHA}" 2>&1 || true)
          echo "$out" | grep -q "Refusing to listen on non-loopback"
      # Fails on Critical/High findings that have a fix available (accepted ones: .trivyignore.yaml); the rest goes to the job summary.
      # Runs before anything is pushed. Needs no token: the images are read from the local daemon.
      - name: Scan images for known vulnerabilities
        run: scripts/scan-image.sh "$IMAGE:${GITHUB_SHA}" "$WEB_IMAGE:${GITHUB_SHA}"
      # Build once: the exact images that passed the smoke tests are handed to the publish job.
      - name: Save images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE:${GITHUB_SHA}" "$WEB_IMAGE:${GITHUB_SHA}" | gzip > images.tar.gz
      - name: Upload images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    # Only main publishes, tagged with the commit SHA and latest.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sookmoo/gatekeeper
      WEB_IMAGE: ghcr.io/sookmoo/gatekeeper-web
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - name: Load images
        run: gunzip -c images.tar.gz | docker load
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker tag "$WEB_IMAGE:${GITHUB_SHA}" "$WEB_IMAGE:latest"
          docker push "$WEB_IMAGE:${GITHUB_SHA}"
          docker push "$WEB_IMAGE:latest"
