name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin connection for the Postgres contract/API tests (each test creates its own database).
      GATEKEEPER_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=ci-only;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Skips cleanly until a solution exists.
      - name: Build and test
        run: |
          if compgen -G "*.sln" >/dev/null || compgen -G "*.slnx" >/dev/null; then
            dotnet restore
            dotnet build --no-restore -warnaserror
            dotnet test --no-build
          else
            echo "No solution yet, skipping."
          fi
      - name: Check migrations are up to date with the model
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Gatekeeper.Infrastructure.Postgres

  image:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sookmoo/gatekeeper
      WEB_IMAGE: ghcr.io/sookmoo/gatekeeper-web
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Containerfile -t "$IMAGE:${GITHUB_SHA}" .
      - name: Smoke test (refuses to start without the non-loopback opt-in)
        run: |
          out=$(docker run --rm "$IMAGE:${GITHUB_SHA}" 2>&1 || true)
          echo "$out" | grep -q "Refusing to listen on non-loopback"
      - name: Build web image
        run: docker build -f Containerfile.web -t "$WEB_IMAGE:${GITHUB_SHA}" .
      - name: Smoke test web (refuses to start without the non-loopback opt-in)
        run: |
          out=$(docker run --rm "$WEB_IMAGE:${GITHUB_SHA}" 2>&1 || true)
          echo "$out" | grep -q "Refusing to listen on non-loopback"
      # Build once, promote the same image: only main publishes, tagged with the commit SHA.
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker tag "$WEB_IMAGE:${GITHUB_SHA}" "$WEB_IMAGE:latest"
          docker push "$WEB_IMAGE:${GITHUB_SHA}"
          docker push "$WEB_IMAGE:latest"
